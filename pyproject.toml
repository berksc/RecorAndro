version = "0.1.0"
description = "Local Android/Termux foundation and environment diagnostics"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
recorandro = "recorandro.cli:main"

[tool.setuptools.packages.find]
include = ["recorandro*"]
